[package]
name = "wired-paper"
version = "1.3.0"
description = "Wired Paper for Windows and Linux"
authors = ["Wired Office"]
license = "MIT"
repository = "https://github.com/Wired-Office/Wired-Paper"
edition = "2021"
rust-version = "1.77"

[lib]
name = "wired_paper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only talks to Ollama on this computer, so no TLS.
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
